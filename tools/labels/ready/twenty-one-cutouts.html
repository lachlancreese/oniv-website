<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ready.css"><style>
.label { background: #EFE4D4; color: #1C1917; }
.num { top: 236px; font-size: 452px; line-height: 1; letter-spacing: -0.03em; color: #F8F1E5; text-shadow: 0 3px 0 rgba(28,25,23,0.10); }
.name { top: 764px; font-size: 156px; line-height: 1; }
.kicker { top: 962px; font-size: 24px; color: #5E5A52; }
.style { top: 1074px; font-size: 22px; color: #7D776D; }
</style></head><body><div class="label">
<canvas class="art" id="art" width="1063" height="1181"></canvas>
<div class="t num serif">21</div>
<div class="t name script">Sophie</div>
<div class="t kicker caps">Twenty-one years</div>
<div class="t style caps">Brut NV &middot; Sparkling</div>
</div>
<script src="paint.js"></script><script>
// Paper cut-outs in the spirit of mid-century collage: a sage arch, leafy fronds, a sun and a scatter of shapes.
(function () {
  const p = painter(document.getElementById("art"), 20270521);
  const { g, rr, rnd } = p;
  p.paper("#EFE4D4", 0.04, 0.03);
  const SAGE = "#8A9E8C", CLAY = "#D2896A", MUSTARD = "#DCA548", BLUSH = "#ECBDA9", DEEP = "#3F5B4D", CREAM = "#F8F1E5";
  function cut(draw, colour) {
    g.save(); g.shadowColor = "rgba(40,30,20,0.16)"; g.shadowBlur = 8; g.shadowOffsetX = 2; g.shadowOffsetY = 3;
    draw(); g.fillStyle = colour; g.fill(); g.restore();
  }
  // A cut-paper sprig: a stem with broad leaves on alternating sides.
  function sprig(x, y, ang, len, colour, n) {
    g.save(); g.shadowColor = "rgba(40,30,20,0.16)"; g.shadowBlur = 8; g.shadowOffsetX = 2; g.shadowOffsetY = 3;
    const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
    p.stem([[x, y], [(x + ex) / 2 + Math.sin(ang) * 14, (y + ey) / 2 - Math.cos(ang) * 14], [ex, ey]], 7, colour);
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 0.2), px = x + (ex - x) * t, py = y + (ey - y) * t, side = i % 2 ? 1 : -1;
      p.leaf(px, py, ang + side * rr(0.6, 0.85), rr(74, 100) * (1.1 - t * 0.35), rr(24, 30) * (1.1 - t * 0.3), side * 0.12, colour, null, { fat: 0.62 });
    }
    p.leaf(ex, ey, ang, 86, 26, 0.05, colour, null, { fat: 0.62 });
    g.restore();
  }
  // The sun, half hidden behind the arch.
  cut(() => { g.beginPath(); g.arc(842, 600, 92, 0, Math.PI * 2); }, MUSTARD);
  // A blush half moon at the top left.
  cut(() => { g.beginPath(); g.arc(214, 236, 96, Math.PI * 0.5, Math.PI * 1.5, true); g.closePath(); }, BLUSH);
  // Sprigs reaching out from behind the arch.
  sprig(330, 650, Math.PI + 0.55, 250, CLAY, 4);
  sprig(320, 520, Math.PI + 0.02, 200, DEEP, 3);
  sprig(735, 300, -0.68, 250, DEEP, 4);
  sprig(752, 430, -0.05, 180, CLAY, 3);
  // The arch.
  cut(() => { g.beginPath(); g.moveTo(286, 700); g.lineTo(286, 396); g.arc(531.5, 396, 245.5, Math.PI, 0); g.lineTo(777, 700); g.closePath(); }, SAGE);
  // A cream inner arch line, cut thin.
  g.beginPath(); g.moveTo(312, 700); g.lineTo(312, 396); g.arc(531.5, 396, 219.5, Math.PI, 0); g.lineTo(751, 700);
  g.strokeStyle = "rgba(248,241,229,0.55)"; g.lineWidth = 3; g.stroke();
  // Little shapes: dots, a star and a wavy strip.
  const bits = [[150, 520, MUSTARD], [930, 230, BLUSH], [900, 820, DEEP], [140, 860, CLAY], [980, 470, CLAY], [92, 380, DEEP], [960, 980, MUSTARD], [104, 1010, BLUSH]];
  bits.forEach(([x, y, c]) => cut(() => { g.beginPath(); g.arc(x, y, rr(12, 22), 0, Math.PI * 2); }, c));
  cut(() => {
    g.beginPath(); const x = 186, y = 120, r = 30;
    for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + (k / 10) * Math.PI * 2, rad = k % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
    g.closePath();
  }, MUSTARD);
  cut(() => { g.beginPath(); g.ellipse(912, 118, 26, 26, 0, 0, Math.PI * 2); }, CLAY);
  p.grainOver(0.03);
})();
</script></body></html>
