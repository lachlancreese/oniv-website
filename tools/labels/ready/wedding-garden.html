<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ready.css"><style>
.label { background: #FAF6F0; color: #2A2622; }
.n1 { top: 452px; font-size: 150px; line-height: 1; }
.amp { top: 596px; font-size: 88px; line-height: 1; color: #9C7E52; }
.n2 { top: 676px; font-size: 150px; line-height: 1; }
.date { top: 912px; font-size: 24px; color: #6E655C; letter-spacing: 0.42em; }
.note { top: 962px; font-size: 34px; color: #4E4740; }
.style { top: 1090px; font-size: 22px; color: #8C847A; }
</style></head><body><div class="label">
<canvas class="art" id="art" width="1063" height="1181"></canvas>
<div class="t n1 script">Olivia</div>
<div class="t amp garamond italic">&amp;</div>
<div class="t n2 script">James</div>
<div class="t date caps">14 &middot; 03 &middot; 2027</div>
<div class="t note garamond italic">Thank you for celebrating with us</div>
<div class="t style caps">Sparkling Rosé</div>
</div>
<script src="paint.js"></script><script>
// A soft watercolour garland across the top: blush and ivory roses, native waxflower, eucalyptus and olive.
(function () {
  const p = painter(document.getElementById("art"), 20270314);
  const { g, rr, rnd, hsl } = p;
  p.paper("#FAF6F0", 0.035, 0.03);
  // Watercolour petal: a soft blob, darker at its edge.
  function petal(x, y, r, ang, h, s, l, a, squash = 0.7) {
    g.save(); g.translate(x, y); g.rotate(ang);
    p.blobPath(0, 0, r, 0.12, 20, 1, squash);
    const gr = g.createRadialGradient(-r * 0.3, 0, r * 0.1, 0, 0, r);
    gr.addColorStop(0, hsl(h, s, Math.min(98, l + 8), a)); gr.addColorStop(1, hsl(h, s + 6, l - 6, a));
    g.fillStyle = gr; g.fill();
    g.lineWidth = 1.3; g.strokeStyle = hsl(h, s + 8, l - 22, a * 0.35); g.stroke();
    g.restore();
  }
  function rose(x, y, r, h, s, l) {
    // Broad, cupped petals in rings, lighter outside and deeper towards the heart.
    p.wash(x + 4, y + 8, r * 1.05, h, s, l - 10, 0.12, 2);
    for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2 + rr(-0.15, 0.15); petal(x + Math.cos(a) * r * 0.52, y + Math.sin(a) * r * 0.52, r * 0.56, a + Math.PI / 2, h, s - 6, l + 4, 0.9, 0.72); }
    for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 + 0.5; petal(x + Math.cos(a) * r * 0.32, y + Math.sin(a) * r * 0.32, r * 0.46, a + Math.PI / 2, h, s, l, 0.92, 0.7); }
    for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2 + 1.1; petal(x + Math.cos(a) * r * 0.16, y + Math.sin(a) * r * 0.16, r * 0.32, a + Math.PI / 2, h, s + 4, l - 6, 0.94, 0.66); }
    petal(x, y, r * 0.17, rr(0, 3), h, s + 8, l - 12, 0.95, 0.8);
    g.strokeStyle = hsl(h, s + 10, l - 30, 0.5); g.lineWidth = 1.6;
    for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(x + rr(-2, 2), y + rr(-2, 2), r * (0.07 + k * 0.08), rr(0, 6), rr(0, 6) + rr(1.6, 2.6)); g.stroke(); }
  }
  function waxflower(x, y, r, pink) {
    for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2 + rr(0, 1); petal(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55, r * 0.5, a, pink ? 345 : 40, pink ? 40 : 18, pink ? 88 : 95, 0.95, 0.9); }
    g.beginPath(); g.arc(x, y, r * 0.22, 0, Math.PI * 2); g.fillStyle = hsl(330, 30, 38, 0.85); g.fill();
  }
  const leafCol = () => [rr(110, 160), rr(10, 22), rr(46, 66)];
  function greenSpray(x, y, ang, len, n) {
    const pts = []; for (let i = 0; i <= 10; i++) { const t = i / 10; pts.push([x + Math.cos(ang) * len * t + Math.sin(t * 3) * 8, y + Math.sin(ang) * len * t]); }
    p.stem(pts, 1.6, "rgba(120,130,110,0.6)");
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 0.5), px = x + Math.cos(ang) * len * t, py = y + Math.sin(ang) * len * t;
      const [h, s, l] = leafCol();
      const side = i % 2 ? 1 : -1;
      p.leaf(px, py, ang + side * rr(0.5, 0.9), rr(30, 56) * (1.1 - t * 0.5), rr(7, 12), rr(-0.15, 0.15), null, hsl(h, s, l - 16, 0.35),
        { gradient: [hsl(h, s, l - 6, 0.85), hsl(h, s, l + 8, 0.85)], vein: hsl(h, s, l + 18, 0.4) });
    }
  }
  function roundLeaves(x, y, ang, len, n) {
    const pts = []; for (let i = 0; i <= 10; i++) { const t = i / 10; pts.push([x + Math.cos(ang) * len * t, y + Math.sin(ang) * len * t + Math.sin(t * 4) * 5]); }
    p.stem(pts, 1.4, "rgba(120,130,120,0.55)");
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 0.3), px = x + Math.cos(ang) * len * t, py = y + Math.sin(ang) * len * t;
      for (const side of [-1, 1]) {
        const off = rr(10, 16), qx = px + Math.cos(ang + side * 1.4) * off, qy = py + Math.sin(ang + side * 1.4) * off;
        p.blobPath(qx, qy, rr(9, 14) * (1.1 - t * 0.4), 0.06, 16);
        g.fillStyle = hsl(rr(175, 195), rr(10, 16), rr(68, 78), 0.85); g.fill(); g.strokeStyle = hsl(190, 12, 52, 0.3); g.lineWidth = 1; g.stroke();
      }
    }
  }
  // Two clusters at the top corners, joined by trailing greenery across the top.
  function cluster(cx, cy, dir) {
    p.wash(cx, cy, 150, 140, 14, 86, 0.18, 4, 1.2, 0.8);
    for (let i = 0; i < 9; i++) greenSpray(cx + rr(-30, 30), cy + rr(-20, 20), (dir > 0 ? 0 : Math.PI) + rr(-0.9, 0.9), rr(170, 260), Math.round(rr(5, 9)));
    for (let i = 0; i < 4; i++) roundLeaves(cx + rr(-20, 20), cy + rr(-20, 20), (dir > 0 ? 0.3 : Math.PI - 0.3) + rr(-0.8, 0.8), rr(120, 170), 5);
    greenSpray(cx, cy, dir > 0 ? -0.04 : Math.PI + 0.04, 330, 10);
    rose(cx - dir * 78, cy - 40, 58, 38, 22, 92);
    rose(cx + dir * 108, cy - 24, 50, 18, 42, 87);
    rose(cx - dir * 46, cy + 78, 46, 38, 20, 91);
    rose(cx + dir * 14, cy + 8, 80, 12, 46, 83);
    for (let i = 0; i < 20; i++) waxflower(cx + rr(-170, 190) * dir, cy + rr(-110, 130), rr(8, 12), rnd() < 0.45);
  }
  cluster(200, 200, 1);
  cluster(863, 200, -1);
  // A small sprig between the date and the note line... kept tiny so names stay the hero.
  greenSpray(470, 868, 0.05, 120, 5); greenSpray(593, 868, Math.PI - 0.05, 120, 5);
  waxflower(531, 868, 10, true);
  p.grainOver(0.025);
})();
</script></body></html>
