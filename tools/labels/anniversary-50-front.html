<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.label { background: #F5EFE3; color: #1C1917; }
.frame { position: absolute; inset: 34px; border: 2px solid #B08D57; }
.frame::after { content: ""; position: absolute; inset: 12px; border: 1px solid #B08D57; opacity: 0.6; }
.top { position: absolute; top: 118px; width: 100%; text-align: center; font-size: 26px; color: #8C6A3C; }
.fifty { position: absolute; top: 120px; width: 100%; text-align: center; font-size: 720px; line-height: 1; color: #EADFC6; letter-spacing: -0.04em; }
.n1, .n2 { position: absolute; width: 100%; text-align: center; font-size: 136px; line-height: 1; }
.n1 { top: 330px; }
.amp { position: absolute; top: 478px; width: 100%; text-align: center; font-size: 104px; line-height: 1; color: #A8824A; }
.n2 { top: 600px; }
.years { position: absolute; top: 810px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 30px; font-size: 34px; color: #4A4542; }
.years i { display: block; width: 90px; border-top: 2px solid #B08D57; }
.style { position: absolute; top: 985px; width: 100%; text-align: center; font-size: 25px; color: #4A4542; }
</style></head><body><div class="label">
<div class="frame"></div>
<div class="fifty serif">50</div>
<div class="top caps">A golden anniversary</div>
<div class="n1 serif">Margaret</div>
<div class="amp serif">&amp;</div>
<div class="n2 serif">John</div>
<div class="years caps"><i></i>1976 &middot; 2026<i></i></div>
<div class="style caps">Cabernet Sauvignon &middot; 2024</div>
</div></body></html>
