<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.label { background: #F6F2EA; color: #1C1917; }
.frame { position: absolute; inset: 34px; border: 3px solid #8A9E8C; }
.frame::after { content: ""; position: absolute; inset: 11px; border: 1.5px solid #8A9E8C; opacity: 0.55; }
.slot { position: absolute; top: 170px; left: 50%; width: 640px; height: 340px; margin-left: -320px; border: 4px dashed #8A9E8C; border-radius: 24px; display: grid; place-items: center; color: #4D604F; font-size: 40px; letter-spacing: 0.3em; }
.rule { position: absolute; top: 600px; left: 50%; width: 100px; margin-left: -50px; border-top: 3px solid #8A9E8C; }
.line { position: absolute; top: 660px; width: 100%; text-align: center; font-size: 96px; line-height: 1; }
.var { position: absolute; top: 905px; width: 100%; text-align: center; font-size: 26px; color: #4A4542; }
</style></head><body><div class="label">
<div class="frame"></div>
<div class="slot caps">Your logo</div>
<div class="rule"></div>
<div class="line serif">Gala Night</div>
<div class="var caps">Shiraz &middot; 2025</div>
</div></body></html>
